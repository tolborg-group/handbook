[workspace]
authors = ["Mads-Peter Verner Christiansen <mpvc@bio.aau.dk>"]
channels = ["conda-forge"]
name = "handbook"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
render = { cmd = "quarto render", cwd = "docs" }
preview = { cmd = "quarto preview", cwd = "docs" }

[dependencies]
python = "==3.12"
quarto = ">=1.9.38,<2"
pyyaml = ">=6.0.3,<7"
ipykernel = ">=7.4.0,<8"
nbformat = ">=5.11.1,<6"
nbclient = ">=0.11.0,<0.12"
